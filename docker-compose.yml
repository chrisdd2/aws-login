services:
  keycloak:
      image: quay.io/keycloak/keycloak:26.0
      restart: unless-stopped
      command: start-dev --import-realm
      environment:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
      ports:
        # http://localhost:8180 - matches OIDC_ISSUER_URL in .env
        - "8180:8080"

volumes:
  postgres_data:
