accounts:
  - name: main
    awsaccountid: 232123091230
    roles:
      - arn:iam::role/developer
      - arn:iam::role/otherdeveloper
      - arn:ssm::instance/jumphosts

principals:
  - name: main_devs
    claim: developers
    roles:
      - arn:iam::main:assume/developer
      - arn:iam::main:credentials/developer
      - arn:ssm::main:shell/developer
      - arn:ssm::main:portforward/developer
      - arn:ssm::main:remoteportforward/developer

iam_roles:
  - name: developer
    maxsessionduration: 8h
    policies:
      - readonly
    tags:
      - developer
iam_policies:
  - name: dev
    Text:
ssm_instances:
  - name: jumphosts
    shellaccess: true
    portfordwardinghosts:
      - rds:5432
    tagfilter:
