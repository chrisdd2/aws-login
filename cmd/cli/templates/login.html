{{define "login"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #dfe2e6;
    --text: #1c2126;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-contrast: #ffffff;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
    --danger-text: #b91c1c;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --surface: #1c2126;
      --border: #2c333a;
      --text: #e5e7eb;
      --muted: #9aa2ad;
      --accent: #3b82f6;
      --accent-contrast: #ffffff;
      --danger-bg: #3a1a1a;
      --danger-border: #6b2b2b;
      --danger-text: #fca5a5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 90%;
    max-width: 360px;
    text-align: center;
  }
  .card h1 {
    font-size: 1.1rem;
    margin: 0 0 1.25rem;
  }
  .error {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger-text);
    border-radius: var(--radius);
    padding: .75rem 1rem;
    font-size: .85rem;
    margin-bottom: 1.25rem;
    white-space: pre-line;
    text-align: left;
  }
  .btn {
    display: inline-block;
    padding: .6rem 1.5rem;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-size: .9rem;
    cursor: pointer;
    text-decoration: none;
    background: var(--accent);
    color: var(--accent-contrast);
  }
  .btn:hover { opacity: .9; }
</style>
</head>
<body>
  <div class="card">
    <h1>{{.Title}}</h1>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <a class="btn" href="/login">Log in</a>
  </div>
</body>
</html>
{{end}}
