{{define "login"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{template "styles"}}
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: hsl(var(--muted) / 0.4);
  }
  .login {
    width: 100%;
    max-width: 380px;
    padding: 1.5rem;
  }
  .login-header {
    display: flex;
    flex-direction: column;
    gap: .375rem;
    margin-bottom: 1.5rem;
  }
  .login-header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.2;
  }
  .login .alert-destructive { margin-bottom: 1rem; }
</style>
</head>
<body>
  <div class="card login">
    <div class="login-header">
      <h1>{{.Title}}</h1>
      <p class="muted">Sign in with your identity provider to access your AWS roles.</p>
    </div>
    {{if .Error}}<div class="alert-destructive" role="alert">{{.Error}}</div>{{end}}
    <a class="btn btn-block" href="/login">Log in</a>
  </div>
</body>
</html>
{{end}}
